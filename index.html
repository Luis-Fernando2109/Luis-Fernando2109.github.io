<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HoraCerta - Calendário Escolar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="login-screen" class="login-container">
    <div class="login-box">
      <div class="logo">⏰ <span>HoraCerta</span></div>
      <h2>Acessar Sistema</h2>
      <form id="form-login">
        <label>Seu Nome / Identificação</label>
        <input type="text" id="login-nome" placeholder="Ex: João Silva" required />

        <label>Sua Função (Papel)</label>
        <select id="login-papel" required>
          <option value="aluno">Aluno</option>
          <option value="professor">Professor</option>
          <option value="gestor">Gestor (Coordenação/Direção)</option>
          <option value="admin">Administrador</option>
        </select>

        <button type="submit" class="btn btn-primary">Entrar no Sistema</button>
      </form>
    </div>
  </div>

  <div id="app" class="app-container hidden">
    
    <header class="navbar">
      <div class="nav-left">
        <div class="logo">⏰ <span>HoraCerta</span></div>
        <span class="badge-role" id="user-role-badge">Aluno</span>
      </div>
      <div class="nav-center">
        <h2 id="current-month-display">Agosto 2026</h2>
      </div>
      <div class="nav-right">
        <span id="user-name-display">Usuário</span>
        <button class="btn btn-outline" id="btn-logout">Sair</button>
      </div>
    </header>

    <div class="main-layout">
      
      <aside class="sidebar">
        <div class="actions-group">
          <h3>Ações Rápidas</h3>
          
          <button class="btn btn-action hidden" id="btn-novo-evento">+ Novo Evento / Prova</button>
          
          <button class="btn btn-action btn-secondary hidden" id="btn-pegar-aula">✋ Pegar Aula Vaga</button>
          
          <button class="btn btn-action btn-warning hidden" id="btn-aprovar-trocas">📋 Aprovar Trocas (<span id="count-trocas">1</span>)</button>
          <button class="btn btn-action btn-warning hidden" id="btn-bloquear-horario">🏟️ Bloquear Horário (Ex: Quadra)</button>

          <button class="btn btn-action btn-secondary hidden" id="btn-feedback">💬 Reportar Problema / Sugestão</button>
          
          <button class="btn btn-action btn-danger hidden" id="btn-admin-aviso">📢 Emitir Aviso Geral</button>
        </div>

        <div class="legend">
          <h3>Categorias</h3>
          <ul>
            <li><span class="dot dot-aula"></span> Aula</li>
            <li><span class="dot dot-prova"></span> Prova / Trabalho</li>
            <li><span class="dot dot-feriado"></span> Feriado</li>
            <li><span class="dot dot-atividade"></span> Evento Escolar</li>
          </ul>
        </div>
      </aside>

      <main class="content">
        <div id="banner-aviso" class="banner-aviso">
          📌 <strong>Aviso Recente:</strong> 5º e 6º horário cancelados no dia 12/08 devido a evento na quadra.
        </div>

        <div class="calendar-grid-header">
          <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
        </div>

        <div class="calendar-grid" id="calendar-body">
          </div>
      </main>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close" id="modal-close">&times;</span>
      <h3 id="modal-title">Título do Modal</h3>
      <div id="modal-body">
        </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
